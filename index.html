<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Widget Patrón Composite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h2>Explorador Composite</h2>
    
    <!-- Panel Interactivo -->
    <div class="controls">
      <input type="text" id="nameInput" placeholder="Nombre (ej. app.js)" />
      <input type="number" id="sizeInput" placeholder="KB" style="width: 70px;" />
      <select id="parentSelect">
        <option value="root">Proyecto_Final (Raíz)</option>
        <option value="src">src</option>
      </select>
      <button onclick="addFile()">+ Agregar Archivo</button>
    </div>

    <!-- Render Arbol -->
    <div id="app"></div>
  </div>

  <script>
    // 1. Componente Base
    class FileSystemItem {
      constructor(name) { this.name = name; }
      getSize() { throw new Error("Método abstracto"); }
      render() { throw new Error("Método abstracto"); }
    }

    // 2. Hoja (Leaf)
    class FileItem extends FileSystemItem {
      constructor(name, size) {
        super(name);
        this.size = Number(size);
      }
      getSize() { return this.size; }
      render() {
        return `<div class="file">📄 ${this.name} <span class="badge">${this.getSize()} KB</span></div>`;
      }
    }

    // 3. Compuesto
    class FolderItem extends FileSystemItem {
      constructor(name) {
        super(name);
        this.children = [];
      }
      add(item) { this.children.push(item); }
      getSize() {
        return this.children.reduce((acc, child) => acc + child.getSize(), 0);
      }
      render() {
        const childrenHTML = this.children.map(child => child.render()).join('');
        return `
          <div class="folder">
            📁 <strong>${this.name}</strong> <span class="badge">${this.getSize()} KB total</span>
            <div>${childrenHTML}</div>
          </div>
        `;
      }
    }

    // Instancias fijas
    const root = new FolderItem("Proyecto_Final");
    const src = new FolderItem("src");
    
    src.add(new FileItem("index.js", 15));
    src.add(new FileItem("styles.css", 10));
    root.add(src);
    root.add(new FileItem("README.md", 5));

    function updateTree() {
      document.getElementById("app").innerHTML = root.render();
    }

    function addFile() {
      const name = document.getElementById("nameInput").value || "nuevo_archivo.txt";
      const size = document.getElementById("sizeInput").value || 5;
      const target = document.getElementById("parentSelect").value;

      const newFile = new FileItem(name, size);

      if (target === "src") src.add(newFile);
      else root.add(newFile);

      document.getElementById("nameInput").value = "";
      document.getElementById("sizeInput").value = "";
      updateTree();
    }

    updateTree();
  </script>
</body>
</html>
